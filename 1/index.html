<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Robot's Fans - Team 9484</title>
    
    <style>
        /* --- 1. VARIÁVEIS E RESET --- */
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --text-color: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #ffb800;
            --secondary: #30004a; /* Roxo escuro da imagem */
            --border-color: #27272a;
            --font-main: system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-main); line-height: 1.5; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* --- 2. UTILITÁRIOS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-8 { gap: 2rem; }
        .w-full { width: 100%; }
        .mt-4 { margin-top: 1rem; }
        .hidden { display: none !important; }
        
        .text-white { color: #ffffff; }
        .hover-primary:hover { color: var(--primary); }

        /* Grid Responsivo */
        .grid { display: grid; gap: 2rem; }
        @media (min-width: 640px) { .sm-grid-2 { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { 
            .md-grid-3 { grid-template-columns: repeat(3, 1fr); } 
            .md-flex { display: flex !important; }
            .md-hidden { display: none !important; }
        }
        @media (min-width: 1024px) { .lg-grid-4 { grid-template-columns: repeat(4, 1fr); } }

        /* --- 3. COMPONENTES --- */
        .btn { padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary { background-color: var(--primary); color: var(--secondary); }
        .btn-primary:hover { background-color: #fff; box-shadow: 0 0 15px rgba(255, 184, 0, 0.4); }
        .btn-icon { padding: 0.5rem; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-icon:hover { color: var(--primary); }
        .icon-svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* --- 4. HEADER --- */
        header { position: sticky; top: 0; z-index: 50; background-color: var(--secondary); border-bottom: 1px solid rgba(255, 255, 255, 0.05); height: 80px; display: flex; align-items: center; }
        .nav-link { font-size: 1rem; font-weight: 600; text-transform: capitalize; letter-spacing: 0.02em; }
        
        /* --- 5. HERO --- */
        .hero { background: linear-gradient(180deg, var(--secondary) 0%, var(--bg-color) 100%); padding: 5rem 1rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero h2 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 1rem; line-height: 1.1; }
        .text-highlight { color: var(--primary); }
        .hero p { max-width: 600px; margin: 0 auto; color: var(--text-muted); font-size: 1.1rem; }

        /* --- 6. PRODUTOS --- */
        .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 3rem; margin-top: 3rem; }
        .filter-btn { padding: 0.5rem 1.25rem; border-radius: 9999px; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.875rem; font-weight: 600; transition: 0.3s; background: transparent; }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { background-color: var(--primary); color: var(--secondary); border-color: var(--primary); }

        .product-card { display: flex; flex-direction: column; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1rem; transition: 0.3s; }
        .product-card:hover { border-color: rgba(255, 184, 0, 0.5); transform: translateY(-5px); }
        .img-wrapper { position: relative; border-radius: 0.5rem; overflow: hidden; aspect-ratio: 1/1; margin-bottom: 1rem; background-color: #09090b; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .product-card:hover .product-img { transform: scale(1.05); }
        
        .product-cat { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem; }
        .product-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; }
        .product-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.4em; }
        .product-price { font-family: monospace; font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        /* --- 7. ABA DO CARRINHO (SIDEBAR) --- */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(2px); }
        .cart-overlay.open { opacity: 1; pointer-events: all; }
        
        .cart-sidebar { position: fixed; top: 0; right: 0; height: 100vh; width: 100%; max-width: 400px; background-color: var(--card-bg); border-left: 1px solid var(--border-color); z-index: 70; transform: translateX(100%); transition: transform 0.3s ease-in-out; display: flex; flex-direction: column; box-shadow: -5px 0 25px rgba(0,0,0,0.5); }
        .cart-sidebar.open { transform: translateX(0); }
        
        .cart-header { padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-body { padding: 1.5rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .cart-footer { padding: 1.5rem; border-top: 1px solid var(--border-color); background-color: #09090b; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-item-info h4 { font-size: 0.95rem; font-weight: 600; color: white; margin-bottom: 0.25rem; }
        .cart-item-info span { font-size: 0.85rem; color: var(--text-muted); }
        .cart-item-price { font-family: monospace; font-weight: bold; color: var(--primary); }
        .btn-remove { color: #ef4444; padding: 0.5rem; border-radius: 0.25rem; transition: 0.3s; }
        .btn-remove:hover { background-color: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>

    <!-- Aba do Carrinho (Sidebar) -->
    <div id="cart-overlay" class="cart-overlay" onclick="closeCart()"></div>
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2 style="font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                O Seu Carrinho
            </h2>
            <button onclick="closeCart()" class="btn-icon" style="background: rgba(255,255,255,0.1);">
                <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <div id="cart-body" class="cart-body">
            <!-- Itens do carrinho aparecem aqui -->
        </div>
        
        <div class="cart-footer">
            <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
                <span style="color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem;">Total a pagar:</span>
                <span id="cart-total" style="font-size: 1.75rem; font-weight: 800; color: var(--primary); font-family: monospace;">R$ 0.00</span>
            </div>
            <button class="btn btn-primary w-full" style="padding: 1rem;" onclick="alert('Funcionalidade de pagamento a ser implementada!')">Finalizar Encomenda</button>
        </div>
    </div>

    <!-- Cabeçalho (Header) -->
    <header>
        <div class="container flex justify-between items-center w-full">
            
            <!-- Logotipo -->
            <div class="flex items-center gap-3">
                <img src="./logos vetorizadas.png" alt="Logo District 9484" style="height: 45px; object-fit: contain;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                
                <div class="flex flex-col" style="display: none;">
                    <h1 style="font-size: 1.125rem; font-weight: 800; line-height: 1; text-transform: uppercase;">Robot's Fans</h1>
                    <p style="font-size: 0.65rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em;">Team #9484</p>
                </div>
            </div>

            <!-- Links de Navegação -->
            <nav class="hidden md-flex gap-8 items-center text-white nav-link">
                <a href="#" class="hover-primary">Início</a>
                <a href="#produtos" class="hover-primary">Produtos</a>
                <a href="#" class="hover-primary">Missão</a>
            </nav>

            <!-- Ações: Pesquisa, Carrinho e Menu -->
            <div class="flex items-center gap-6">
                
                <button class="btn-icon hidden md-flex" title="Pesquisar">
                    <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>

                <button onclick="openCart()" class="btn btn-primary">
                    <svg class="icon-svg" style="stroke: var(--secondary); width: 18px; height: 18px;" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span>CARRINHO (<span id="cart-badge">0</span>)</span>
                </button>

                <button class="btn-icon md-hidden">
                    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="hero">
        <h2>Apoie a Equipa <br><span class="text-highlight">Robot's District</span></h2>
        <p>Todo o valor das vendas é revertido para a compra de peças de robótica e inscrições em torneios. Ajude-nos a construir o futuro!</p>
    </div>

    <!-- Área de Produtos -->
    <section id="produtos" class="container" style="padding-bottom: 5rem;">
        <div class="filters" id="filters">
            <button class="filter-btn active" data-category="Todos">Todos</button>
            <button class="filter-btn" data-category="Vestuário">Vestuário</button>
            <button class="filter-btn" data-category="Sustentáveis">Sustentáveis</button>
            <button class="filter-btn" data-category="Colecionáveis">Colecionáveis</button>
        </div>

        <div class="grid sm-grid-2 md-grid-3 lg-grid-4" id="product-grid">
            <!-- Produtos renderizados por JS -->
        </div>
    </section>

    <!-- Rodapé -->
    <footer style="background-color: var(--bg-color); padding: 3rem 0; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 0.8rem;">
        © 2026 Robot's District #9484.
    </footer>

    <!-- Lógica JavaScript Local (Sem Firebase) -->
    <script>
        // Array com os dados dos produtos
        const products = [
            { id: 1, name: "Camisola Oficial 9484", price: 65.00, category: "Vestuário", image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&q=80&w=600", description: "O nosso manto oficial para as competições." },
            { id: 2, name: "Boné District #9484", price: 35.00, category: "Vestuário", image: "./Robots Fans- 9484.jpg", fallbackImg: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&q=80&w=600", description: "Boné exclusivo com a marca da equipa." },
            { id: 3, name: "Garrafa Térmica", price: 45.00, category: "Sustentáveis", image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&q=80&w=600", description: "Mantém a água fresca durante a construção do robô." },
            { id: 4, name: "Ecobag Resistente", price: 25.00, category: "Sustentáveis", image: "https://images.unsplash.com/photo-1597484662317-c93138801d0c?auto=format&fit=crop&q=80&w=600", description: "Perfeita para carregar ferramentas e cabos." },
            { id: 5, name: "Porta-chaves Engrenagem", price: 15.00, category: "Colecionáveis", image: "https://images.unsplash.com/photo-1622547748225-3fc4abd2cca0?auto=format&fit=crop&q=80&w=600", description: "Impresso em 3D pela nossa equipa de mecânica." },
            { id: 6, name: "Pack Autocolantes", price: 10.00, category: "Colecionáveis", image: "https://images.unsplash.com/photo-1572375992501-4b0892d50c69?auto=format&fit=crop&q=80&w=600", description: "Decore o seu computador portátil como um verdadeiro fã." }
        ];

        // Estado do carrinho de compras na memória
        let cart = [];

        // Funções para abrir/fechar o carrinho
        window.openCart = () => {
            document.getElementById('cart-sidebar').classList.add('open');
            document.getElementById('cart-overlay').classList.add('open');
        };

        window.closeCart = () => {
            document.getElementById('cart-sidebar').classList.remove('open');
            document.getElementById('cart-overlay').classList.remove('open');
        };

        // Função para atualizar o interface do carrinho
        window.updateCartUI = () => {
            const cartBody = document.getElementById('cart-body');
            const cartBadge = document.getElementById('cart-badge');
            const cartTotal = document.getElementById('cart-total');

            // Atualiza o contador do botão
            cartBadge.innerText = cart.length;

            if (cart.length === 0) {
                cartBody.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-muted); gap: 1rem;">
                        <svg class="icon-svg" style="width:48px; height:48px; opacity:0.5;" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                        <p>O seu carrinho está vazio.</p>
                    </div>`;
                cartTotal.innerText = `R$ 0.00`;
                return;
            }

            let total = 0;
            cartBody.innerHTML = '';
            
            cart.forEach(item => {
                total += item.price;
                cartBody.innerHTML += `
                    <div class="cart-item">
                        <div class="flex items-center gap-4">
                            <img src="${item.image}" alt="${item.productName}" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color);">
                            <div>
                                <h4>${item.productName}</h4>
                                <div class="cart-item-price">R$ ${item.price.toFixed(2)}</div>
                            </div>
                        </div>
                        <button onclick="removeFromCart('${item.cartId}')" class="btn-remove" title="Remover Produto">
                            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
            });

            cartTotal.innerText = `R$ ${total.toFixed(2)}`;
        };

        // Adicionar um produto ao carrinho
        window.addToCart = (productData) => {
            // Cria um ID único para cada item no carrinho
            const uniqueCartId = Date.now().toString() + Math.random().toString(36).substring(2);
            
            cart.push({
                cartId: uniqueCartId,
                productName: productData.name,
                price: Number(productData.price),
                image: productData.image
            });
            
            updateCartUI();
            openCart(); // Abre o menu lateral quando se adiciona um item
        };

        // Remover um produto do carrinho
        window.removeFromCart = (cartId) => {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
        };

        // Renderizar a grelha de produtos na página
        const renderProducts = (category) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            // Filtra pela categoria selecionada ou mostra todos
            const filtered = category === 'Todos' ? products : products.filter(p => p.category === category);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // Prepara os dados do produto para passar na função onClick
                const productDataStr = JSON.stringify({ 
                    name: product.name, 
                    price: product.price, 
                    image: product.image 
                }).replace(/"/g, '&quot;');
                
                const fallbackAttr = product.fallbackImg ? `onerror="this.src='${product.fallbackImg}'"` : `onerror="this.src='https://placehold.co/400x400/18181b/ffb800?text=Foto'"`;

                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${product.image}" alt="${product.name}" class="product-img" ${fallbackAttr}>
                    </div>
                    <div class="flex flex-col" style="flex:1;">
                        <div class="product-cat">${product.category}</div>
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-desc">${product.description}</p>
                        <div style="margin-top: auto; padding-top: 1rem;">
                            <div class="product-price">R$ ${Number(product.price).toFixed(2)}</div>
                            <button onclick="window.addToCart(${productDataStr})" class="btn btn-primary w-full mt-4">
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        // Inicializar a página quando carregar
        document.addEventListener('DOMContentLoaded', () => {
            // Mostra os produtos e o estado inicial do carrinho
            renderProducts('Todos');
            updateCartUI();

            // Lógica dos botões de filtro
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Remove a classe 'active' de todos e adiciona no clicado
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    // Renderiza os produtos com a nova categoria
                    renderProducts(e.target.dataset.category);
                });
            });
        });
    </script>
</body>
</html>

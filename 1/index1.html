<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Robot's Fans - Team 9484</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

   <!-- Aba do Carrinho (Sidebar) -->
    <div id="cart-overlay" class="cart-overlay" onclick="closeCart()"></div>
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2 style="font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                O Seu Carrinho
            </h2>
            <button onclick="closeCart()" class="btn-icon" style="background: rgba(255,255,255,0.1);">
                <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <div id="cart-body" class="cart-body">
            <!-- Itens do carrinho aparecem aqui -->
        </div>
        
        <div class="cart-footer">
            <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
                <span style="color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem;">Total a pagar:</span>
                <span id="cart-total" style="font-size: 1.75rem; font-weight: 800; color: var(--primary); font-family: monospace;">R$ 0.00</span>
            </div>
            <button class="btn btn-primary w-full" style="padding: 1rem;" onclick="alert('Funcionalidade de pagamento a ser implementada!')">Finalizar Encomenda</button>
        </div>
    </div>

    <!-- Cabeçalho (Header) -->
    <header>
        <div class="container flex justify-between items-center w-full">
            
            <!-- Logotipo -->
            <div class="flex items-center gap-3">
                <img src="./logos vetorizadas.png" alt="Logo District 9484" style="height: 45px; object-fit: contain;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                
                <div class="flex flex-col" style="display: none;">
                    <h1 style="font-size: 1.125rem; font-weight: 800; line-height: 1; text-transform: uppercase;">Robot's Fans</h1>
                    <p style="font-size: 0.65rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em;">Team #9484</p>
                </div>
            </div>

            <!-- Links de Navegação -->
            <nav class="hidden md-flex gap-8 items-center text-white nav-link">
                <a href="#" class="hover-primary">Início</a>
                <a href="#produtos" class="hover-primary">Produtos</a>
                <a href="#" class="hover-primary">Missão</a>
            </nav>

            <!-- Ações: Pesquisa, Carrinho e Menu -->
            <div class="flex items-center gap-6">
                
                <button class="btn-icon hidden md-flex" title="Pesquisar">
                    <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>

                <button onclick="openCart()" class="btn btn-primary">
                    <svg class="icon-svg" style="stroke: var(--secondary); width: 18px; height: 18px;" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span>CARRINHO (<span id="cart-badge">0</span>)</span>
                </button>

                <button class="btn-icon md-hidden">
                    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="hero">
        <h2>Apoie a Equipa <br><span class="text-highlight">Robot's District</span></h2>
        <p>Todo o valor das vendas é revertido para a compra de peças de robótica e inscrições em torneios. Ajude-nos a construir o futuro!</p>
    </div>

    <!-- Área de Produtos -->
    <section id="produtos" class="container" style="padding-bottom: 5rem;">
        <div class="filters" id="filters">
            <button class="filter-btn active" data-category="Todos">Todos</button>
            <button class="filter-btn" data-category="Vestuário">Vestuário</button>
            <button class="filter-btn" data-category="Sustentáveis">Sustentáveis</button>
            <button class="filter-btn" data-category="Colecionáveis">Colecionáveis</button>
        </div>

        <div class="grid sm-grid-2 md-grid-3 lg-grid-4" id="product-grid">
            <!-- Produtos renderizados por JS -->
        </div>
    </section>

    <!-- Rodapé -->
    <footer style="background-color: var(--bg-color); padding: 3rem 0; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 0.8rem;">
        © 2026 Robot's District #9484.
    </footer>
